[package]
name = "computed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
async-compression = { version = "0.4.52", features = ["tokio", "zstd"] }
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ssh-key = { version = "0.6", features = ["std", "ed25519", "p256", "p384", "rsa"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
