[package]
name = "modal-client"
version = "0.2.1"
edition = "2024"
description = "Minimal client for Modal's gRPC API: apps, registry images, secrets and Sandboxes"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.105"
base64 = "0.22"
bytes = "1"
futures-util = "0.3.34"
prost = "0.14.6"
prost-types = "0.14.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "io-util", "macros"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots", "tls-native-roots"] }
tonic-prost = "0.14.9"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = { version = "0.14.9", default-features = false }
